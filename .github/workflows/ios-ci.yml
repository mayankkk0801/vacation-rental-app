name: iOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit messages
        run: ./scripts/verify-clean-commits.sh
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project VecationRental.xcodeproj -scheme VecationRental
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project VecationRental.xcodeproj \
            -scheme VecationRental \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:VecationRentalTests \
            | xcpretty && exit ${PIPESTATUS[0]}
